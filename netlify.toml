[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://script.google.com/macros/s/AKfycbwUipO_fQ7XB0635MSN8cjg37VVmFLvZgeEVAaB5_tuo5gSBzo6C9ST5zCwZIB96Whu/exec?:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*; connect-src 'self' https://script.google.com https://script.googleusercontent.com;"

[[headers]]
  for = "/Logo.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/scripts.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
